services:
  postgres:
    image: postgres:16
    container_name: ticket-booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-booking} -d $${POSTGRES_DB:-booking}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
